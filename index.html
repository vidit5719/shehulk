<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SHE HULK Transformation</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="scene" id="scene">
    <div class="stars"></div>
    <div class="title">
      <div>SHE HULK</div>
      <span>TRANSFORMATION</span>
    </div>

    <div class="energy energy-a"></div>
    <div class="energy energy-b"></div>

    <div class="character" id="character" aria-label="Animated superhero transformation">
      <div class="aura"></div>

      <div class="hair back-hair"></div>
      <div class="head">
        <div class="face">
          <div class="eye left"></div>
          <div class="eye right"></div>
          <div class="brow left"></div>
          <div class="brow right"></div>
          <div class="nose"></div>
          <div class="mouth"></div>
        </div>
      </div>
      <div class="hair front-hair"></div>

      <div class="neck"></div>
      <div class="torso">
        <div class="chest"></div>
        <div class="emblem">S</div>
      </div>

      <div class="arm left-arm">
        <div class="upper-arm"></div>
        <div class="forearm"></div>
        <div class="hand"></div>
      </div>
      <div class="arm right-arm">
        <div class="upper-arm"></div>
        <div class="forearm"></div>
        <div class="hand"></div>
      </div>

      <div class="hips"></div>
      <div class="leg left-leg">
        <div class="thigh"></div>
        <div class="shin"></div>
        <div class="boot"></div>
      </div>
      <div class="leg right-leg">
        <div class="thigh"></div>
        <div class="shin"></div>
        <div class="boot"></div>
      </div>

      <div class="impact"></div>
    </div>

    <div class="caption" id="caption">READY?</div>

    <div class="controls">
      <button id="transformBtn">⚡ TRANSFORM</button>
      <button id="resetBtn">↺ RESET</button>
    </div>

    <div class="hint">Click TRANSFORM and watch the character evolve.</div>
  </main>

  <script src="script.js"></script>
</body>
</html>
